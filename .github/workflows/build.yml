name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle 8.2 (compatible with AGP 8.2.0)
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d $HOME/gradle
        echo "$HOME/gradle/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        gradle --version
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CleanerPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish APK as Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Cleaner Pro build ${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
